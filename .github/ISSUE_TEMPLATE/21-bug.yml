name: "Bug 反馈 / Bug report"
description: "启动器报错、功能异常、界面显示或交互问题"
title: "[Bug] "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        提交到 PCL Lite 本仓库。先搜索已有问题；一个 Issue 记录一个问题。
        偶发或无法稳定复现也可以反馈，请写出出现前的操作。不要上传密码、令牌或个人隐私。
  - type: input
    id: version
    attributes:
      label: "PCL Lite 版本 / Version"
      description: "填写完整版本、架构和通道；旧版本也可报告，请注明是否测试过新版。"
      placeholder: "例如：1.7.7，x64，正式版"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "系统与环境 / Environment"
      placeholder: "Windows 版本；涉及画面问题时补充显卡、缩放、多屏、玻璃设置"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: "实际表现与预期 / Actual and expected behavior"
      description: "发生了什么？你期望发生什么？可直接粘贴截图或录屏。"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "操作步骤与发生频率 / Steps and frequency"
      placeholder: |
        1. 打开……
        2. 点击……
        发生频率：每次 / 偶发 / 仅一次；无法复现时写出最后的操作。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "日志与附件 / Logs and attachments"
      description: "设置 → 查看日志 → 导出日志。崩溃或重启过请导出全部日志。无法导出时说明原因；上传前检查并遮盖敏感信息。"
