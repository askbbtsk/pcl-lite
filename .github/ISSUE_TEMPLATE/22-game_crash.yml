name: "游戏崩溃或无法启动 / Game crash"
description: "Java、基岩版或 Lunar 游戏启动失败、异常退出"
title: "[Crash] "
labels: [bug, crash, needs-triage]
body:
  - type: input
    id: launcher
    attributes:
      label: "PCL Lite 版本与系统 / Launcher version and OS"
      placeholder: "完整版本、x64 / ARM64、Windows 版本"
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: "游戏类型 / Game type"
      options:
        - Java 版
        - 基岩版
        - Lunar
    validations:
      required: true
  - type: textarea
    id: instance
    attributes:
      label: "实例环境 / Instance environment"
      placeholder: "游戏版本、加载器及版本、Java（如适用）、模组或整合包信息"
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: "问题表现与触发步骤 / Failure and steps"
      description: "启动前、进入游戏中还是退出时发生？最近是否更新过游戏、加载器或模组？"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "启动器与游戏日志 / Launcher and game logs"
      description: "可上传导出的全部日志、latest.log、崩溃报告。无法取得时说明原因；不要上传账号令牌。"
  - type: textarea
    id: comparison
    attributes:
      label: "已尝试的排查 / Checks already tried"
      description: "可选。无需先安装其他启动器，也不要为了排查删除原实例或存档。"
