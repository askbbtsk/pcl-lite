name: "性能与体验优化 / Performance and usability"
description: "卡顿、内存或 CPU/GPU 占用、索引或下载速度等优化建议"
title: "[Performance] "
labels: [enhancement, performance, needs-triage]
body:
  - type: input
    id: environment
    attributes:
      label: "版本与设备环境 / Version and hardware"
      placeholder: "PCL Lite 版本、系统、CPU、内存、显卡；涉及磁盘时说明 HDD / SSD"
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: "具体场景与当前表现 / Scenario and current behavior"
      placeholder: "执行什么操作、数据规模、耗时或占用；没有测量值也可描述体感。"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: "希望改进的结果 / Desired improvement"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "测量、日志或录屏 / Evidence"
      description: "可选。不要为了测量修改系统安全设置或删除数据。"
