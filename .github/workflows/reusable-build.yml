name: Build (Reusable)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      configuration:
        required: true
        type: string
      architecture:
        required: true
        type: string

jobs:
  build:
    name: Build
    # C#/WinRT's projection compiler is a Windows executable.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      LANG: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Describe
        run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build Project
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
          BUILD_ARCHITECTURE: ${{ inputs.architecture }}
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          if [[ "$BUILD_CONFIGURATION" != "CI" && "$BUILD_CONFIGURATION" != "Release" && "$BUILD_CONFIGURATION" != "Beta" ]]; then
            echo "Invalid build configuration" >&2
            exit 1
          fi
          if [[ "$BUILD_ARCHITECTURE" != "x64" && "$BUILD_ARCHITECTURE" != "ARM64" ]]; then
            echo "Invalid build architecture" >&2
            exit 1
          fi
          if [[ "$BUILD_CONFIGURATION" != "CI" && -z "${PCL_MS_CLIENT_ID:-}" ]]; then
            echo "CLIENT_ID repository secret is required for every published build" >&2
            exit 1
          fi
          dotnet publish "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" \
          -p:Configuration="$BUILD_CONFIGURATION" -p:Platform="$BUILD_ARCHITECTURE" \
          -p:DeleteExistingFiles=true -o ./artifact --no-self-contained

      - name: Verify compact single-file output
        shell: pwsh
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        run: |
          $binary = Get-Item -LiteralPath './artifact/Plain Craft Launcher 2.exe'
          Write-Host "Executable size: $($binary.Length) bytes"
          if ($env:BUILD_CONFIGURATION -ne 'CI' -and $binary.Length -gt 30000000) {
            throw "The launcher exceeds the 30 MB release size limit."
          }
          foreach ($name in @('Microsoft.Windows.SDK.NET.dll', 'WinRT.Runtime.dll')) {
            if (Get-ChildItem ./artifact -Recurse -Filter $name) {
              throw "Unexpected external Windows projection: $name"
            }
          }

      - name: Upload the Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PCL2_CE_${{ inputs.configuration }}_${{ inputs.architecture }}
          path: artifact/**
