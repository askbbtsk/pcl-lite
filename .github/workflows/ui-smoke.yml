name: UI smoke (native controls)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-controls:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Test native-control detector
        run: dotnet run --project tools/UiSmoke/UiSmoke.csproj -- --self-test
      - name: Reject native interactive controls
        run: dotnet run --project tools/UiSmoke/UiSmoke.csproj --no-build
