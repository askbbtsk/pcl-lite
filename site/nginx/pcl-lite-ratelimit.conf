# PCL Lite 官网的限流区 —— 必须放在 http 上下文，所以放 conf.d。
#
# pcllite_wellknown: 微软发布者域验证文件（/.well-known/*）的下载限速。
#   5r/m = 每分钟 5 次，配合站点里的 burst=5 nodelay：
#   前 5 次直接放行，之后每 12 秒才放 1 次，超了返回 429。
#   验证动作本身只抓一次，正常不会触发；这条主要是防止文件被当免费 CDN 刷。
limit_req_zone $binary_remote_addr zone=pcllite_wellknown:10m rate=5r/m;
limit_req_status 429;
