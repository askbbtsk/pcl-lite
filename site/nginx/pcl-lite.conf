# PCL Lite 官网 —— pcl-lite.firebounce.today
#
# 目录约定：
#   /data/pcl-lite/current   站点根目录，发布新版本时整目录替换
#
# 微软「发布者域」验证用的
#   /.well-known/microsoft-identity-association.json
# 放在站点根目录下。验证通过后可以把这个文件删掉；下面那段 location 留着无害
# （文件不在就 404，不影响站点其它部分）。
#
# 为什么 80 和 443 写在同一个 server 里、而且 80 不跳转：
#   1. 微软的验证器直接打 http://，跟着 301 走它判失败 ——
#      报错原文 "Expected: OK, Actual: MovedPermanently"。
#   2. 更麻烦的是 Cloudflare 目前是 Flexible 模式，回源走的是 80。
#      如果这里对 80 做 301，那么 https 的请求到了源站也是 80，
#      又吃到 301 跳回 https —— 变成无限跳转。
#   所以源站两种协议都直接给内容；要强制 HTTPS 请在 Cloudflare 开
#   「Always Use HTTPS」，或者把 SSL 模式改成 Full 再回来加跳转。

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pcl-lite.firebounce.today;

    ssl_certificate     /data/firebounce-guide/certs/firebounce.today.crt;
    ssl_certificate_key /data/firebounce-guide/certs/firebounce.today.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:FBSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 橙云回源时 $remote_addr 是 CF 边缘 IP，按它限流等于全网共用一个桶
    include /etc/nginx/snippets/cf-realip.conf;

    root /data/pcl-lite/current;
    index index.html;

    access_log /var/log/nginx/pcl-lite-access.log;
    error_log /var/log/nginx/pcl-lite-error.log warn;

    # ── 微软发布者域验证文件 ─────────────────────────────────────────
    # 限速：5 次/分钟（突发 5 次，之后每 12 秒放行 1 次），超了回 429。
    # 验证动作本身只抓一次，正常不会触发。
    location = /.well-known/microsoft-identity-association.json {
        limit_req zone=pcllite_wellknown burst=5 nodelay;
        limit_req_status 429;

        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # 其它 .well-known 也吃同一档限速，避免这里变成没闸门的静态目录
    location ^~ /.well-known/ {
        limit_req zone=pcllite_wellknown burst=5 nodelay;
        limit_req_status 429;

        try_files $uri =404;
    }

    # 静态站点：找不到的路径回 index.html（单页站点友好）
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # 静态资源长缓存；index.html 和上面那个 json 不缓存
    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 别让站点把 .git / 备份文件漏出去
    location ~ /\.(?!well-known) {
        deny all;
    }
}
